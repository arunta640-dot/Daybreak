<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daybreak</title>
<meta name="theme-color" content="#5b5bf0">
<meta name="description" content="Daybreak: daily routines that reset every morning, plus a full to-do list.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header><div class="hrow" id="head"></div></header>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav><div class="in" id="nav"></div></nav>
<dialog id="sheet"></dialog>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" class="hidden">Undo</button></div>
<input type="file" id="importFile" accept="application/json" class="hidden">
<script src="app.js"></script>
</body>
</html>
